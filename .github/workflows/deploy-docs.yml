name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-docs.yml'
      - 'docs-astro/**'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-astro/pnpm-lock.yaml
      - run: cd docs-astro && pnpm install --frozen-lockfile
      - run: cd docs-astro && pnpm build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-astro/dist
